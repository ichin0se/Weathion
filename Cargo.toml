[package]
name = "Weathion"
version = "0.1.0"
edition = "2021"

[dependencies]
time = { version = "0.3.37" }
time-macros = { version = "0.2.0-alpha.1" }
rand = "0.8"
tokio = { version = "1.28", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ratatui = { version = "0.29", features = ["widget-calendar"] }
crossterm = "0.25"
anyhow = "1.0"
dotenv = "0.15"
